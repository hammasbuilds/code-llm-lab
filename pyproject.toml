[project]
name = "code-llm-lab"
version = "0.1.0"
description = "Seven measurements of a local coder model: where model size pays, when self-debugging stops helping, what model-written tests actually catch, and how much of a benchmark score is the prompt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mbpp", "humaneval", "code-generation", "evaluation", "mutation-testing", "pass-at-k"]
# pandas only, and only to read HumanEval's parquet. Execution is stdlib subprocess,
# mutation is stdlib ast, and the model is reached over plain HTTP with urllib.
dependencies = ["pandas>=2.2", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
